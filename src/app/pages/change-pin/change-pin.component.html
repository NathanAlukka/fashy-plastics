<div class="pin-heading"><h1>Change My PIN</h1><p>{{auth.profile()?.displayName}}, update only your own login PIN.</p></div>
<section class="pin-card"><p class="privacy">For privacy, existing PINs cannot be viewed by Fashy or anyone else.</p>@if(message){<div class="message" [class.success]="success">{{message}}</div>}<form (ngSubmit)="save()"><mat-form-field subscriptSizing="dynamic"><mat-label>Current 6-digit PIN</mat-label><input matInput type="password" [ngModel]="currentPin" (ngModelChange)="digits('currentPin',$event)" name="currentPin" inputmode="numeric" required></mat-form-field><mat-form-field subscriptSizing="dynamic"><mat-label>New 6-digit PIN</mat-label><input matInput type="password" [ngModel]="newPin" (ngModelChange)="digits('newPin',$event)" name="newPin" inputmode="numeric" required></mat-form-field><mat-form-field subscriptSizing="dynamic"><mat-label>Confirm new PIN</mat-label><input matInput type="password" [ngModel]="confirmPin" (ngModelChange)="digits('confirmPin',$event)" name="confirmPin" inputmode="numeric" required></mat-form-field><button mat-flat-button type="submit" [disabled]="saving||currentPin.length!==6||newPin.length!==6||confirmPin.length!==6">{{saving?'Changing…':'Change my PIN'}}</button></form></section>
